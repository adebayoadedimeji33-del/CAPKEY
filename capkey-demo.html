<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CAPKEY — live demo</title>
<script src="https://unpkg.com/@solana/web3.js@1.99.0/lib/index.iife.min.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111826;
    --border: #1f2b3d;
    --blue: #4da3ff;
    --green: #3ddc84;
    --red: #ff5c5c;
    --text: #dbe6f2;
    --dim: #7891a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 24px;
    max-width: 780px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 10px 0; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input {
    width: 100%;
    background: #0d1420;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 13px;
    margin-bottom: 10px;
  }
  button {
    background: var(--blue);
    color: #06121f;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    margin: 3px 4px 3px 0;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.danger { background: var(--red); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .status { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .status b { color: var(--text); }
  #log {
    background: #05080c;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    max-height: 420px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  .info { color: var(--dim); }
  a { color: var(--blue); }
</style>
</head>
<body>

<h1>🔑 CAPKEY — live demo</h1>
<div class="sub">onchain spending-policy vaults for AI agents · devnet</div>

<div class="card">
  <h2>1. Connect</h2>
  <label>Program ID (copy this from Solana Playground's "Program ID" box)</label>
  <input id="programId" placeholder="paste your deployed program id here" />
  <div class="row">
    <button id="btnConnect">Connect Phantom Wallet</button>
  </div>
  <div class="status" id="walletStatus">Not connected.</div>
</div>

<div class="card">
  <h2>2. One-time setup</h2>
  <div class="row">
    <button id="btnSetup" disabled>Create mock USDC + accounts</button>
  </div>
  <div class="status" id="setupStatus">Connect your wallet first.</div>
</div>

<div class="card">
  <h2>3. The vault</h2>
  <div class="row">
    <button id="btnCreateVault" disabled>Create vault (deposit 10 USDC)</button>
    <button id="btnSetPolicy" disabled>Set policy (max 5/tx, daily cap 8, allow payee)</button>
  </div>
  <div class="row">
    <button id="btnPayGood" disabled>Agent pays $2 (within policy)</button>
    <button id="btnPayOverCap" disabled class="danger">Agent tries to pay $6 (over cap)</button>
    <button id="btnPayStranger" disabled class="danger">Agent tries to pay a stranger</button>
  </div>
  <div class="row">
    <button id="btnRevoke" disabled class="danger">Revoke agent (kill switch)</button>
    <button id="btnPayAfterRevoke" disabled class="danger">Agent tries to pay again</button>
    <button id="btnWithdraw" disabled>Withdraw leftover funds to owner</button>
  </div>
  <div class="status" id="vaultStatus"></div>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="log">Waiting...</div>
</div>

<script>
const { PublicKey, Keypair, Transaction, TransactionInstruction, SystemProgram,
        SYSVAR_RENT_PUBKEY, LAMPORTS_PER_SOL, Connection } = solanaWeb3;

const RPC_URL = "https://api.devnet.solana.com";
const connection = new Connection(RPC_URL, "confirmed");

const TOKEN_PROGRAM_ID = new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
const ASSOCIATED_TOKEN_PROGRAM_ID = new PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL");
const VAULT_SEED = new TextEncoder().encode("capkey-vault");
const DECIMALS = 6;
const ONE = 1_000_000n; // 10^DECIMALS
const usdc = (n) => BigInt(n) * ONE;

// ---- Anchor instruction discriminators: first 8 bytes of sha256("global:<name>") ----
// Precomputed and verified against the actual program source (see error codes below).
const DISC = {
  create_vault:     Uint8Array.from([29,237,247,208,193,82,54,135]),
  fund_vault:        Uint8Array.from([26,33,207,242,119,108,134,73]),
  set_policy:        Uint8Array.from([40,133,12,157,235,202,2,132]),
  execute_payment:   Uint8Array.from([86,4,7,7,120,139,232,139]),
  revoke_agent:      Uint8Array.from([227,60,209,125,240,117,163,73]),
  withdraw_unused:   Uint8Array.from([51,218,244,36,251,4,43,27]),
};

const ERROR_NAMES = {
  6000: "ZeroAmount", 6001: "VaultRevoked", 6002: "VaultExpired",
  6003: "ExceedsMaxPerTx", 6004: "ExceedsDailyLimit", 6005: "RecipientNotAllowed",
  6006: "TooManyRecipients", 6007: "PolicyInconsistent", 6008: "WrongAgent",
  6009: "VaultStillActive", 6010: "NothingToWithdraw",
};

function u64le(n) {
  const b = new Uint8Array(8); const v = BigInt(n);
  for (let i = 0; i < 8; i++) b[i] = Number((v >> BigInt(8*i)) & 0xffn);
  return b;
}
function i64le(n) { return u64le(n); } // fine for our small positive timestamps
function concatBytes(...arrs) {
  const len = arrs.reduce((s,a) => s + a.length, 0);
  const out = new Uint8Array(len); let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}
function pubkeyVec(pubkeys) {
  const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, pubkeys.length, true);
  return concatBytes(len, ...pubkeys.map(p => p.toBytes()));
}

async function findAta(mint, owner) {
  const [ata] = await PublicKey.findProgramAddress(
    [owner.toBuffer(), TOKEN_PROGRAM_ID.toBuffer(), mint.toBuffer()],
    ASSOCIATED_TOKEN_PROGRAM_ID
  );
  return ata;
}
function ataCreateIx(payer, ata, owner, mint) {
  return new TransactionInstruction({
    programId: ASSOCIATED_TOKEN_PROGRAM_ID,
    keys: [
      { pubkey: payer, isSigner: true, isWritable: true },
      { pubkey: ata, isSigner: false, isWritable: true },
      { pubkey: owner, isSigner: false, isWritable: false },
      { pubkey: mint, isSigner: false, isWritable: false },
      { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
    ],
    data: new Uint8Array([]),
  });
}
function initMintIx(mint, decimals, authority) {
  const data = concatBytes(new Uint8Array([0, decimals]), authority.toBytes(), new Uint8Array([0]));
  return new TransactionInstruction({
    programId: TOKEN_PROGRAM_ID,
    keys: [
      { pubkey: mint, isSigner: false, isWritable: true },
      { pubkey: SYSVAR_RENT_PUBKEY, isSigner: false, isWritable: false },
    ],
    data,
  });
}
function mintToIx(mint, dest, authority, amount) {
  const data = concatBytes(new Uint8Array([7]), u64le(amount));
  return new TransactionInstruction({
    programId: TOKEN_PROGRAM_ID,
    keys: [
      { pubkey: mint, isSigner: false, isWritable: true },
      { pubkey: dest, isSigner: false, isWritable: true },
      { pubkey: authority, isSigner: true, isWritable: false },
    ],
    data,
  });
}

function log(msg, cls) {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function explorerLink(sig) {
  return `https://explorer.solana.com/tx/${sig}?cluster=devnet`;
}

// Instant feedback so a click is never ambiguous, and nothing fails silently.
document.querySelectorAll("button").forEach((b) => {
  b.addEventListener("click", () => log(`\n▶ clicked: ${b.textContent.trim()}`, "info"), true);
});
window.addEventListener("unhandledrejection", (e) => {
  const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  log(`  ✗ ERROR: ${msg}`, "bad");
});
window.addEventListener("error", (e) => {
  log(`  ✗ ERROR: ${e.message}`, "bad");
});

// Sends a tx, waits for it to land, and always shows the program logs —
// this is the whole point: a "blocked" step is a SUCCESSFUL demo outcome.
// usePhantom=true  -> owner action, fee payer is your connected wallet, Phantom pops up.
// usePhantom=false -> agent-only action, fee payer is the local agent keypair, no popup.
async function sendAndReport(tx, extraSigners, label, usePhantom) {
  const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
  tx.recentBlockhash = blockhash;
  if (usePhantom) tx.feePayer = wallet.publicKey;
  // else: caller must have already set tx.feePayer = agent.publicKey

  for (const s of extraSigners) tx.partialSign(s);

  const signed = usePhantom ? await window.solana.signTransaction(tx) : tx;
  const raw = signed.serialize();
  const sig = await connection.sendRawTransaction(raw, { skipPreflight: true });
  await connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, "confirmed");
  const txInfo = await connection.getTransaction(sig, { commitment: "confirmed", maxSupportedTransactionVersion: 0 });
  const logs = txInfo?.meta?.logMessages || [];
  const err = txInfo?.meta?.err;

  log(`\n▶ ${label}`, "info");
  log(`  tx: ${sig}`);
  log(`  ${explorerLink(sig)}`);
  if (err) {
    const codeMatch = JSON.stringify(err).match(/"Custom":(\d+)/);
    const code = codeMatch ? Number(codeMatch[1]) : null;
    const name = code !== null ? (ERROR_NAMES[code] || `code ${code}`) : JSON.stringify(err);
    log(`  ✗ REJECTED ONCHAIN — ${name}`, "bad");
  } else {
    log(`  ✓ confirmed`, "ok");
  }
  logs.forEach(l => log(`  | ${l}`, "info"));
  return { sig, err, logs };
}

// ---- state ----
let wallet = { publicKey: null };
let programId = null;
let agent = Keypair.generate();      // the AI agent's own keypair, lives only in this tab
let mint = null, ownerAta = null, payeeAta = null, strangerAta = null;
let payee = Keypair.generate();
let stranger = Keypair.generate();
let vaultPda = null, vaultBump = null, vaultAta = null;

document.getElementById("btnConnect").onclick = async () => {
  if (!window.solana || !window.solana.isPhantom) {
    alert("Phantom wallet extension not found. Install it from phantom.app, switch it to Devnet, then reload this page.");
    return;
  }
  const pidStr = document.getElementById("programId").value.trim();
  if (!pidStr) { alert("Paste your deployed Program ID first."); return; }
  try { programId = new PublicKey(pidStr); }
  catch { alert("That doesn't look like a valid Program ID."); return; }

  const resp = await window.solana.connect();
  wallet.publicKey = resp.publicKey;
  const bal = await connection.getBalance(wallet.publicKey);
  document.getElementById("walletStatus").innerHTML =
    `Connected: <b>${wallet.publicKey.toBase58()}</b> — ${(bal/LAMPORTS_PER_SOL).toFixed(3)} SOL`;
  document.getElementById("btnSetup").disabled = false;
  document.getElementById("setupStatus").textContent = "Ready.";
  log(`Connected wallet ${wallet.publicKey.toBase58()}`, "ok");
  log(`Agent keypair generated for this session: ${agent.publicKey.toBase58()}`, "info");
};

document.getElementById("btnSetup").onclick = async () => {
  document.getElementById("btnSetup").disabled = true;
  const mintKp = Keypair.generate();
  mint = mintKp.publicKey;
  ownerAta = await findAta(mint, wallet.publicKey);
  payeeAta = await findAta(mint, payee.publicKey);
  strangerAta = await findAta(mint, stranger.publicKey);

  const rent = await connection.getMinimumBalanceForRentExemption(82);
  const tx = new Transaction();
  tx.add(SystemProgram.createAccount({
    fromPubkey: wallet.publicKey, newAccountPubkey: mint, lamports: rent, space: 82, programId: TOKEN_PROGRAM_ID,
  }));
  tx.add(SystemProgram.transfer({
    fromPubkey: wallet.publicKey, toPubkey: agent.publicKey, lamports: Math.round(0.02 * LAMPORTS_PER_SOL),
  })); // agent needs its own SOL — it pays its own tx fees on every payment attempt below
  tx.add(initMintIx(mint, DECIMALS, wallet.publicKey));
  tx.add(ataCreateIx(wallet.publicKey, ownerAta, wallet.publicKey, mint));
  tx.add(ataCreateIx(wallet.publicKey, payeeAta, payee.publicKey, mint));
  tx.add(ataCreateIx(wallet.publicKey, strangerAta, stranger.publicKey, mint));
  tx.add(mintToIx(mint, ownerAta, wallet.publicKey, usdc(1000)));

  await sendAndReport(tx, [mintKp], "Setup: mint + accounts created, 1000 mock USDC minted to you", true);
  document.getElementById("setupStatus").textContent = `Mint: ${mint.toBase58()}`;
  document.getElementById("btnCreateVault").disabled = false;
};

document.getElementById("btnCreateVault").onclick = async () => {
  const [pda, bump] = await PublicKey.findProgramAddress(
    [VAULT_SEED, wallet.publicKey.toBuffer(), agent.publicKey.toBuffer(), mint.toBuffer()], programId
  );
  vaultPda = pda; vaultBump = bump;
  vaultAta = await findAta(mint, vaultPda); // owner off-curve is fine, PDA never signs as a wallet

  const data = concatBytes(DISC.create_vault, u64le(usdc(10)));
  const ix = new TransactionInstruction({
    programId,
    keys: [
      { pubkey: wallet.publicKey, isSigner: true, isWritable: true },
      { pubkey: agent.publicKey, isSigner: true, isWritable: false },
      { pubkey: vaultPda, isSigner: false, isWritable: true },
      { pubkey: vaultAta, isSigner: false, isWritable: true },
      { pubkey: mint, isSigner: false, isWritable: true },
      { pubkey: ownerAta, isSigner: false, isWritable: true },
      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
      { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      { pubkey: ASSOCIATED_TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
    ],
    data,
  });
  const tx = new Transaction().add(ix);
  await sendAndReport(tx, [agent], "Create vault — deposit 10 USDC, agent bound", true);
  document.getElementById("btnSetPolicy").disabled = false;
};

document.getElementById("btnSetPolicy").onclick = async () => {
  const expiry = Math.floor(Date.now()/1000) + 3600;
  const data = concatBytes(
    DISC.set_policy, u64le(usdc(5)), u64le(usdc(8)), i64le(expiry), pubkeyVec([payee.publicKey])
  );
  const ix = new TransactionInstruction({
    programId,
    keys: [
      { pubkey: wallet.publicKey, isSigner: true, isWritable: true },
      { pubkey: vaultPda, isSigner: false, isWritable: true },
    ],
    data,
  });
  const tx = new Transaction().add(ix);
  await sendAndReport(tx, [], "Set policy — max $5/tx, $8/day, payee allow-listed, 1hr expiry", true);
  ["btnPayGood","btnPayOverCap","btnPayStranger","btnRevoke"].forEach(id => document.getElementById(id).disabled = false);
};

async function agentPay(amount, label) {
  try {
    const data = concatBytes(DISC.execute_payment, u64le(amount));
    const ix = new TransactionInstruction({
      programId,
      keys: [
        { pubkey: vaultPda, isSigner: false, isWritable: true },
        { pubkey: agent.publicKey, isSigner: true, isWritable: false },
        { pubkey: vaultAta, isSigner: false, isWritable: true },
        { pubkey: payeeAta, isSigner: false, isWritable: true },
        { pubkey: mint, isSigner: false, isWritable: false },
        { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
        { pubkey: ASSOCIATED_TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
      ],
      data,
    });
    const tx = new Transaction().add(ix);
    tx.feePayer = agent.publicKey; // agent alone can pay — no wallet popup
    await sendAndReport(tx, [agent], label, false);
  } catch (e) {
    log(`  ✗ ERROR: ${e && e.message ? e.message : e}`, "bad");
  }
}

document.getElementById("btnPayGood").onclick = () => agentPay(usdc(2), "Agent pays payee $2 — within policy");
document.getElementById("btnPayOverCap").onclick = () => agentPay(usdc(6), "Agent tries to pay $6 — exceeds $5 per-tx cap");
document.getElementById("btnPayStranger").onclick = async () => {
 try {
  const data = concatBytes(DISC.execute_payment, u64le(usdc(1)));
  const ix = new TransactionInstruction({
    programId,
    keys: [
      { pubkey: vaultPda, isSigner: false, isWritable: true },
      { pubkey: agent.publicKey, isSigner: true, isWritable: false },
      { pubkey: vaultAta, isSigner: false, isWritable: true },
      { pubkey: strangerAta, isSigner: false, isWritable: true },
      { pubkey: mint, isSigner: false, isWritable: false },
      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
      { pubkey: ASSOCIATED_TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
    ],
    data,
  });
  const tx = new Transaction().add(ix);
  tx.feePayer = agent.publicKey;
  await sendAndReport(tx, [agent], "Agent tries to pay a non-approved stranger", false);
 } catch (e) {
  log(`  ✗ ERROR: ${e && e.message ? e.message : e}`, "bad");
 }
};

document.getElementById("btnRevoke").onclick = async () => {
  const ix = new TransactionInstruction({
    programId,
    keys: [
      { pubkey: wallet.publicKey, isSigner: true, isWritable: true },
      { pubkey: vaultPda, isSigner: false, isWritable: true },
    ],
    data: DISC.revoke_agent,
  });
  const tx = new Transaction().add(ix);
  await sendAndReport(tx, [], "Revoke — permanent kill switch", true);
  document.getElementById("btnPayAfterRevoke").disabled = false;
  document.getElementById("btnWithdraw").disabled = false;
};

document.getElementById("btnPayAfterRevoke").onclick = () => agentPay(usdc(1), "Agent tries to pay after revoke");

document.getElementById("btnWithdraw").onclick = async () => {
  const ix = new TransactionInstruction({
    programId,
    keys: [
      { pubkey: wallet.publicKey, isSigner: true, isWritable: true },
      { pubkey: vaultPda, isSigner: false, isWritable: true },
      { pubkey: vaultAta, isSigner: false, isWritable: true },
      { pubkey: ownerAta, isSigner: false, isWritable: true },
      { pubkey: mint, isSigner: false, isWritable: false },
      { pubkey: TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
      { pubkey: ASSOCIATED_TOKEN_PROGRAM_ID, isSigner: false, isWritable: false },
    ],
    data: DISC.withdraw_unused,
  });
  const tx = new Transaction().add(ix);
  await sendAndReport(tx, [], "Withdraw leftover budget back to owner", true);
};
</script>
</body>
</html>
